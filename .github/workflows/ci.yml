name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run tests
        run: |
          python -m pytest tests/ -v

      - name: Build the macOS application bundle
        run: |
          pip install pyinstaller
          python -m PyInstaller --noconfirm --distpath dist "FigTreeKit Studio.spec"

      - name: Packaged-application self-check
        run: |
          # 冻结包内跑完整生成链（起服务 -> /api/health -> /api/generate ->
          # 校验合法图像与导出记录）。此步过去只是 README 里的人工命令。
          "./dist/FigTreeKit Studio.app/Contents/MacOS/FigTreeKit Studio" --smoke-test
