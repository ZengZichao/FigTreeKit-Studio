name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支/同一 PR 的新提交应取消仍在跑的旧 run：
# 否则连续推送会让多个 macOS 队列同时占用（本仓库的 macOS 配额本就吃紧）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# runner 镜像说明
# --------------------
# 测试与打包钉在 macos-26（= actions/runner-images 的当前 GA，macOS 26 Arm64）
# 而不是 macos-latest。理由：
#   * macos-latest 是移动目标，会在 macOS 大版本切换时无预警改变本仓库的
#     构建环境（此前就是 macos-latest）；
#   * 但也不钉 macos-15 —— 它是上一代 Arm64 镜像，按 GitHub 的退役政策
#     （最多支持 2 个 GA，新 GA 发布后开始退役最旧的），macOS 26 转 GA 后
#     macos-15 就进入退役流程，容量会被优先抽走，job 会长时间排队甚至排不到。
# 钉当前 GA 既有可复现性，又没有退役倒计时。
#
# 升级方法：查 https://github.com/actions/runner-images#available-images
# 确认新的 GA 标签后，同步替换 package job 的 runs-on。
#
# main 分支保护的 required_status_checks 与本工作流的 job 一一对应
# --------------------------------------------------------------------
# required = [Lint, Test (py3.11), Test (py3.12), Package smoke test]
#
# 四个 job 的依赖链是 lint → test → package，因此 `Package smoke test`
# 通过即意味着 lint 与两条测试腿都通过。四个全列为 required 是刻意的冗余：
# 一旦将来有人改动 job 之间的 needs 关系，required 不会随之失效。
#
# 历史记录（供后来者判断，不要重复踩）：
#   2026-10-01 当日 macOS runner 配额一度完全不可得，Package smoke test 在
#   30+ 个 run 中一次都没被调度（in_progress 恒为 0）。当时为避免门禁永久
#   无法通过，临时把它移出 required。同日 07:53Z 配额恢复后该 job 一次跑通
#   （11/11 步），已重新纳入 required。
#
#   若将来 macOS 配额再次耗尽导致该 job 长时间排队，**不要**把
#   Test (py3.11) / Test (py3.12) 换成 Package smoke test 来「凑」一个能过的
#   门禁 —— 那会让打包路径彻底失去门禁。正确做法是临时只保留 ubuntu 侧三项：
#     gh api -X PUT repos/ZengZichao/FigTreeKit-Studio/branches/main/protection \
#       -F 'required_status_checks[contexts][]=Lint' \
#       -F 'required_status_checks[contexts][]=Test (py3.11)' \
#       -F 'required_status_checks[contexts][]=Test (py3.12)'
#   配额恢复后再把 Package smoke test 加回来。ubuntu 侧三条始终可满足，
#   因此这种临时降级不会让门禁失效。

# 默认 GITHUB_TOKEN 权限远宽于本工作流所需；这里显式收窄为只读。
permissions:
  contents: read

jobs:
  # lint 与 test 都跑在 ubuntu-latest，只有 package 留在 macOS。
  #
  # 理由一（成本）：公开仓库的 Linux runner 免费，macOS runner 按 10x 倍率计费。
  #   此前三个 job 全在 macOS，等于把本可免费跑的静态检查与单元测试也按 10x 付费。
  # 理由二（可调度）：macOS runner 池容量远小于 Linux，2026-10-01 实测本仓库的
  #   macOS job 排队 3 分钟仍拿不到 runner，而 ubuntu 侧正常调度。把测试移出
  #   macOS 同时解决了「门禁跑不起来」和「配额被 3 倍放大」两个问题。
  # 理由三（测试本身可移植）：被测代码没有任何 macOS 专属分支 ——
  #   `grep -rE "darwin|platform\.system|sys\.platform|/Users/" figtreekit_studio/ tests/`
  #   无命中；pywebview 是纯 Python wheel（py3-none-any），figtreekit 的依赖
  #   （biopython / pillow / numpy）均有 Linux wheel；渲染所需的 Java 由
  #   setup-java 的 temurin 提供，与 FigTree JAR 本身跨平台。
  #
  # 唯一真正依赖 macOS 的是 PyInstaller 打出的 .app 及其自检，那部分由
  # `package` job 在 macOS 上承担——它对 macOS 环境的验证强度高于把单元测试
  # 在 macOS 上再跑一遍（冻结包内跑完整生成链）。
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install ruff
        # 与 pyproject.toml 的 optional-dependencies.dev 保持同一版本下限。
        run: pip install "ruff>=0.16.9"

      - name: Ruff — syntax errors and undefined names only
        # 规则集刻意保守（E9,F63,F7,F82）：只拦会直接导致运行失败的缺陷。
        # 规则集定义在 pyproject.toml [tool.ruff.lint]，此处不重复，避免两处漂移。
        run: ruff check --no-cache .

  test:
    name: Test (py${{ matrix.python-version }})
    needs: lint
    # 跑在 Linux：被测代码无 macOS 专属分支，且公开仓库的 Linux runner 免费。
    # 详见 jobs 上方注释。macOS 侧的验证由 package job 承担。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 与 pyproject.toml 的 requires-python = ">=3.11" 及 classifiers 保持一致。
        # 只测 3.12 会让 3.11 用户成为事实上的未测试人群。
        python-version: ['3.11', '3.12']
    env:
      # 关闭"静默跳过"：前置条件不满足时判失败，且本 session 出现任何 skip 即整体失败。
      FIGTREEKIT_STUDIO_STRICT_TESTS: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        # 走 dev extra，而非单独 pip install pytest —— 否则 dev 依赖的增删
        # 不会反映到 CI 上（这正是本次审计修掉的一类漂移）。
        run: pip install -e ".[dev]"

      - name: Run tests
        # 覆盖率只在 3.12 这条腿上采集一次，避免重复计算与重复上传。
        # 门槛数值**只**定义在 pyproject.toml 的 [tool.coverage.report]。
        # 此处刻意不抄写那个数字：上一轮把门槛从 65 提到 78 时就因为这里
        # 和 Makefile 各抄了一份而留下过期注释。单一事实来源，不要复制。
        run: |
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            python -m pytest tests/ -v --cov --cov-report=term-missing
          else
            python -m pytest tests/ -v
          fi

  # 唯一真正需要 macOS 的 job：PyInstaller 打 .app 并在冻结包内跑完整生成链。
  # 它对 macOS 运行环境的验证强度高于把单元测试在 macOS 上再跑一遍。
  package:
    name: Package smoke test
    needs: test
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Build the macOS application bundle
        run: |
          pip install "pyinstaller>=6.0"
          python -m PyInstaller --noconfirm --distpath dist "FigTreeKit Studio.spec"

      - name: Packaged-application self-check
        # 冻结包内跑完整生成链（起服务 -> /api/health -> /api/generate ->
        # 校验合法图像与导出记录）。此步过去只是 README 里的人工命令。
        # 路径必须加引号：.app 名称含空格，不加会被 shell 拆成两个参数。
        run: |
          "./dist/FigTreeKit Studio.app/Contents/MacOS/FigTreeKit Studio" --smoke-test
