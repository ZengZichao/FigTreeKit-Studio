[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "figtreekit-studio"
version = "0.1.0"
description = "Visual front-end + reproducible script generator for figtreekit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["figtreekit>=1.1.2", "pywebview>=5.0"]
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "Zeng Zichao" }]
keywords = ["phylogenetics", "figtree", "visualization", "tree", "figtreekit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
figtreekit-studio = "figtreekit_studio.cli:main"

[project.urls]
Homepage = "https://github.com/ZengZichao/FigTreeKit-Studio"
Issues = "https://github.com/ZengZichao/FigTreeKit-Studio/issues"

[tool.setuptools.packages.find]
include = ["figtreekit_studio*"]

[tool.setuptools.package-data]
figtreekit_studio = ["data/*.jar", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
