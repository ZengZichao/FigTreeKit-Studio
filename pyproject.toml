[build-system]
# PEP 639 的 SPDX 字符串形式 license 字段需要 setuptools >= 77；
# 更低版本会直接拒绝 `license = "GPL-2.0-or-later"` 而非降级处理。
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "figtreekit-studio"
version = "0.1.2"
description = "Visual front-end + reproducible script generator for figtreekit"
readme = "README.md"
requires-python = ">=3.11"
# 依赖一律带上界。上界的作用是挡住「静默的主版本跳跃」：
# 本项目不发布到 PyPI（见 README），不存在与其他包做依赖求解的顾虑，
# 因此上界不会给使用方带来冲突，反而把升级变成维护者的一次显式决定。
#
# 实测过的例子：`pywebview>=5.0` 曾解析到 6.2.1。pywebview 6.x 的
# `webview.start()` / `create_file_dialog()` 正是 core/desktop.py 依赖的 API，
# 而这条路径只被冻结包的 `--smoke-test` 覆盖（单元测试注入的是假 webview 模块），
# 一旦 macOS runner 不可用就失去防线。上界把这类风险挡在安装阶段。
#
# 为什么不用 lockfile / constraints.txt：Dependabot 的 pip 生态只认
# requirements.txt、pyproject.toml、Pipfile、poetry.lock 等，它**不会**维护
# 随意的 constraints 文件——那会变成一个悄悄过期、再也没人更新的坑。
# 上界留在 pyproject.toml 里，Dependabot 依然能正常管理。
dependencies = [
    "figtreekit[render]>=1.1.3,<2.0",
    "pywebview>=5.0,<7.0",
]
optional-dependencies = { dev = ["pytest>=8.0,<10", "pytest-cov>=5.0,<8", "ruff>=0.16.9,<0.17"] }
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Zeng Zichao" }]
keywords = ["phylogenetics", "figtree", "visualization", "tree", "figtreekit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# 注意：此处刻意不保留 "License :: OSI Approved :: GNU General Public
# License v2 or later (GPLv2+)" classifier。PEP 639 下 SPDX `license`
# 字段与 license classifier 互斥，同时存在时 setuptools 会直接报错。
# 许可证标识由上面的 `license` 字段与 license-files 唯一承载。

[project.scripts]
figtreekit-studio = "figtreekit_studio.cli:main"

[project.urls]
Homepage = "https://github.com/ZengZichao/FigTreeKit-Studio"
Issues = "https://github.com/ZengZichao/FigTreeKit-Studio/issues"
Changelog = "https://github.com/ZengZichao/FigTreeKit-Studio/blob/main/CHANGELOG.md"
Security = "https://github.com/ZengZichao/FigTreeKit-Studio/security/policy"

[tool.setuptools.packages.find]
include = ["figtreekit_studio*"]

[tool.setuptools.package-data]
figtreekit_studio = ["data/*.jar", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra 让 skip 原因出现在摘要里；--strict-markers 让未注册的 marker 直接报错，
# 避免拼错的 @pytest.mark.slow 静默失效。
addopts = "-ra --strict-markers"
markers = [
    "requires_jar: 需要真实 figtree_patched.jar（严格模式下失败而非跳过）",
    "requires_java: 需要本机可用的 java 可执行文件",
]

# 保守 lint 门禁：只拦语法错误与未定义名（会直接导致运行期失败的缺陷），
# 不介入 import 顺序与行宽等项目当前风格。逐步扩大规则集时，
# 先修既有违规再加规则，不要在同一次改动里既修风格又加门禁。
[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
source = ["figtreekit_studio"]
branch = true

[tool.coverage.report]
# 低于此值即失败。当前实测 83%（本轮补齐 desktop.py 0->100%、cli.py 14->56%、
# core/generator.py 56->96% 之后），门槛设在略低于实测的位置，作用是"不许跌"
# 而非虚构一个够不到的数。留几个百分点余量是为了不因新增一个未测模块而误报。
# 剩余未覆盖：_smoke_test（由 CI 的冻结包 --smoke-test 真实覆盖）、
# server.py 的部分错误分支。
fail_under = 78
show_missing = true
skip_covered = true
